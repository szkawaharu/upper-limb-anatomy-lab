name: v0.76 levator 60-degree extension and 30-degree playback audit
on:
  push:
    branches: [redesign/v076-shoulder]
    paths:
      - '.github/workflows/v076-levator-constrained60-audit30.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_OUTPUT: test-results/v076-levator-60-frames
      QA_LEVATOR_SOLID_FRAMES: '1'
      QA_LEVATOR_SOLID_MAX_INDEX: '160'
      QA_SHOULDER_PREVIEW: '1'
      QA_NUMERIC_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: shoulder-preview-field
          path: test-results/v076-blend-preview/
          run-id: 46082847918
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          export CHROME_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          node tests/browser-v073.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: levator-60-frames
          path: test-results/v076-levator-60-frames/levator-solid-frames.json
  path60:
    needs: frames
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      QA_INPUT: test-results/v076-levator-constrained30
      QA_OUTPUT: test-results/v076-levator-constrained60
      QA_FRAME_FILE: test-results/v076-levator-60-frames/levator-solid-frames.json
      QA_MAX_INDEX: '160'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: levator-constrained30
          path: test-results/v076-levator-constrained30/
          run-id: 46135851243
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: levator-60-frames
          path: test-results/v076-levator-60-frames/
      - run: |
          set -- "$QA_INPUT"/accepted-*-index-80.npz
          test "$#" = 1
          test -f "$1"
          echo "QA_CONSTRAINED_SEED=$1" >> "$GITHUB_ENV"
      - run: python -m pip install -r scripts/calibration/requirements.txt
      - run: python scripts/experimental/run-levator-constrained-path.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levator-constrained60
          path: test-results/v076-levator-constrained60/
  interpolation30:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_INPUT: test-results/v076-levator-constrained30
      QA_OUTPUT: test-results/v076-levator-interpolation30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: levator-constrained30
          path: test-results/v076-levator-constrained30/
          run-id: 46135851243
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install -r scripts/calibration/requirements.txt
      - run: python scripts/experimental/audit-levator-interpolation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levator-interpolation30
          path: test-results/v076-levator-interpolation30/
  contact30:
    strategy:
      fail-fast: false
      matrix:
        bone: [C1, C2, C3, C4, scapula]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_INPUT: test-results/v076-levator-constrained30
      QA_OUTPUT: test-results/v076-levator-constrained30-contact-${{ matrix.bone }}
      QA_BONE: ${{ matrix.bone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: levator-constrained30
          path: test-results/v076-levator-constrained30/
          run-id: 46135851243
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install -r scripts/calibration/requirements.txt
      - run: python scripts/experimental/audit-levator-bone-contact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levator-constrained30-contact-${{ matrix.bone }}
          path: test-results/v076-levator-constrained30-contact-${{ matrix.bone }}/
  crossing30:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_INPUT: test-results/v076-levator-constrained30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: levator-constrained30
          path: test-results/v076-levator-constrained30/
          run-id: 46135851243
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install -r scripts/calibration/requirements.txt
      - run: |
          for file in "$QA_INPUT"/accepted-*-index-*.npz; do
            export QA_CROSSING_CHECKPOINT="$(basename "$file")"
            export QA_OUTPUT="test-results/v076-levator-constrained30-crossings/${QA_CROSSING_CHECKPOINT%.npz}"
            python scripts/experimental/audit-levator-surface-crossings.py
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levator-constrained30-crossings
          path: test-results/v076-levator-constrained30-crossings/
