name: v0.76 levator local volume inequality
on:
  push:
    branches: [redesign/v076-shoulder]
    paths:
      - '.github/workflows/v076-levator-volume-band.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  band:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_INPUT: test-results/v076-levator-bulk15
      QA_OUTPUT: test-results/v076-levator-band15
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: levator-bulk15
          path: test-results/v076-levator-bulk15/
          run-id: 46135288476
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install -r scripts/calibration/requirements.txt
      - run: python tests/reference-levator-volume-band.py
      - run: python scripts/experimental/run-levator-volume-band.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levator-band15
          path: test-results/v076-levator-band15/
