name: v0.76 levator affine playback correction
on:
  push:
    branches: [redesign/v076-shoulder]
    paths:
      - '.github/workflows/v076-levator-affine-playback.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  affine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_INPUT: test-results/v076-levator-constrained30
      QA_OUTPUT: test-results/v076-levator-affine-playback
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: levator-constrained30
          path: test-results/v076-levator-constrained30/
          run-id: 46135851243
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install -r scripts/calibration/requirements.txt
      - run: python scripts/experimental/audit-levator-affine-playback.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levator-affine-playback
          path: test-results/v076-levator-affine-playback/
