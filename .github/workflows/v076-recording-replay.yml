name: v0.76 recording replay (desktop Chromium)
on:
  push:
    branches: [redesign/v076-shoulder]
    paths:
      - 'index.html'
      - 'engine/camera-framing.js'
      - 'tests/browser-v076-recording.mjs'
      - '.github/workflows/v076-recording-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recording-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-v076-recording.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recording-replay
          path: test-results/v076-recording-replay/
