name: v0.76 levator local band path and surface audit
on:
  push:
    branches: [redesign/v076-shoulder]
    paths:
      - '.github/workflows/v076-levator-band-path-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  frozen-path:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_INPUT: test-results/v076-levator-predictor-coupled
      QA_BAND_BULK: '1000'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: levator-predictor-coupled
          path: test-results/v076-levator-predictor-coupled/
          run-id: 46134663885
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install -r scripts/calibration/requirements.txt
      - name: Independent correction of each saved pose, without carrying constraint history
        run: |
          status=0
          for file in "$QA_INPUT"/accepted-*-index-*.npz; do
            export QA_BAND_CHECKPOINT="$(basename "$file")"
            export QA_OUTPUT="test-results/v076-levator-frozen-band/${QA_BAND_CHECKPOINT%.npz}"
            python scripts/experimental/run-levator-volume-band.py || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levator-frozen-band
          path: test-results/v076-levator-frozen-band/
  crossing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_INPUT: test-results/v076-levator-band15
      QA_OUTPUT: test-results/v076-levator-band15-crossings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: levator-band15
          path: test-results/v076-levator-band15/
          run-id: 46135493467
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install -r scripts/calibration/requirements.txt
      - run: python scripts/experimental/audit-levator-surface-crossings.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levator-band15-crossings
          path: test-results/v076-levator-band15-crossings/
  contact:
    strategy:
      fail-fast: false
      matrix:
        bone: [C1, C2, C3, C4, scapula]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_INPUT: test-results/v076-levator-band15-contact
      QA_OUTPUT: test-results/v076-levator-band15-contact-${{ matrix.bone }}
      QA_BONE: ${{ matrix.bone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: levator-band15
          path: test-results/v076-levator-band15/
          run-id: 46135493467
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: levator-predictor-coupled
          path: test-results/v076-levator-predictor-coupled/
          run-id: 46134663885
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          mkdir -p "$QA_INPUT"
          cp test-results/v076-levator-predictor-coupled/levator-solid-frames.json "$QA_INPUT/"
          cp test-results/v076-levator-band15/volume-band-candidate.npz "$QA_INPUT/accepted-000-index-40.npz"
      - run: python -m pip install -r scripts/calibration/requirements.txt
      - run: python scripts/experimental/audit-levator-bone-contact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levator-band15-contact-${{ matrix.bone }}
          path: test-results/v076-levator-band15-contact-${{ matrix.bone }}/
