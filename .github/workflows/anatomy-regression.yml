name: Upper limb anatomy regression
on:
  push:
    branches: [main, feature/v0.73.0-common-engine, redesign/v076-shoulder]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anatomy-and-geometry:
    name: All offline geometry, muscle engine and cervical regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run every offline regression entry point
        run: node scripts/run-tests.mjs
      - name: Validate curated Pages files without deploying
        run: node scripts/prepare-pages.mjs
      - name: Retain per-suite results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-test-results
          path: test-results/
  continuum-reference:
    name: Offline continuum algebra (not anatomical acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical reference dependencies
        run: python -m pip install -r scripts/experimental/requirements-reference.txt
      - name: Verify strain derivatives, boundaries and matrix-free solves
        run: |
          python scripts/experimental/test-volumetric-reference.py
          python scripts/experimental/test-volumetric-gn.py
          python scripts/experimental/test-volumetric-transfer.py
          python scripts/experimental/test-reduced-volume.py
          python scripts/experimental/test-elastic-modes.py
          python scripts/experimental/test-tetrahedral-cage.py
          python scripts/experimental/test-constitutive-metric.py
          python scripts/experimental/test-projected-solid.py
          python scripts/experimental/test-conforming-surface.py
          python scripts/experimental/test-spline-cage.py
          python scripts/experimental/test-landmark-registration.py
          python scripts/experimental/test-continuation.py
          python scripts/experimental/test-point-cage.py
          python scripts/experimental/test-constrained-cage.py
          python scripts/experimental/test-attachment-refinement.py
          python scripts/experimental/test-cage-newton.py
          python scripts/experimental/test-contact-potential.py
          python scripts/experimental/test-source-cage.py
          python scripts/experimental/test-snapshot-names.py
          python scripts/experimental/test-bone-sets.py
  real-source-reference:
    name: Full source continuity reference (not anatomical acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/experimental/requirements-reference.txt
      - run: python tests/reference-v076-trap-upper.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-source-reference
          path: test-results/v076-real-source-reference.json
  prepare-pages:
    name: Prepare GitHub Pages artifact
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [anatomy-and-geometry, continuum-reference, real-source-reference]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare and validate public files
        run: node scripts/prepare-pages.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy-pages:
    name: Publish validated static artifact to GitHub Pages
    needs: prepare-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
