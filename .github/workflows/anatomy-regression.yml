name: Upper limb anatomy regression
on:
  push:
    branches: [main, feature/v0.73.0-common-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anatomy-and-geometry:
    name: All offline geometry, muscle engine and cervical regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run every offline regression entry point
        run: node scripts/run-tests.mjs
      - name: Retain per-suite results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-test-results
          path: test-results/
