name: v073 isolated conditioned frame experiment
on:
  push:
    branches: ['experiment/v073-conditioned-frame']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conditioned-frame-experiment
          path: test-results/
