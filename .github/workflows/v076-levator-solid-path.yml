name: v0.76 levator actual five-bone solid path
on:
  push:
    branches: [redesign/v076-shoulder]
    paths:
      - '.github/workflows/v076-levator-solid-path.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  solid-path:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_LEVATOR_SOLID_FRAMES: '1'
      QA_SHOULDER_PREVIEW: '1'
      QA_NUMERIC_ONLY: '1'
      QA_OUTPUT: test-results/v076-levator-solid-path
      QA_LEVATOR_BULK: '30'
      QA_LEVATOR_ITERATIONS: '150'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: levator-exact-source-solid
          path: test-results/v076-levator-solid/
          run-id: 46113787286
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: shoulder-preview-field
          path: test-results/v076-blend-preview/
          run-id: 46082847918
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install -r scripts/calibration/requirements.txt
      - run: |
          export CHROME_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          node tests/browser-v073.mjs
      - run: python scripts/experimental/run-levator-solid-path.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levator-solid-path
          path: test-results/v076-levator-solid-path/
