name: v0.76 levator five-bone boundary audit
on:
  push:
    branches: [redesign/v076-shoulder]
    paths:
      - '.github/workflows/v076-levator-boundary-registry.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_LEVATOR_EXPERIMENT: '1'
      QA_SHOULDER_PREVIEW: '1'
      QA_NUMERIC_ONLY: '1'
      QA_OUTPUT: test-results/v076-levator-registry
      QA_LEVATOR_MASK_FILE: test-results/v076-levator-surface-candidate/masks.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/v076-levator-boundary-registry.mjs
      - uses: actions/download-artifact@v4
        with:
          name: shoulder-preview-field
          path: test-results/v076-blend-preview/
          run-id: 46082847918
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: levator-surface-candidate
          path: test-results/v076-levator-surface-candidate/
          run-id: 46110560300
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          export CHROME_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          node tests/browser-v073.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levator-registry
          path: test-results/v076-levator-registry/
