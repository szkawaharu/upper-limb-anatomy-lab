name: v0.76 levator 15-degree local volume and contact
on:
  push:
    branches: [redesign/v076-shoulder]
    paths:
      - '.github/workflows/v076-levator-15-volume-contact.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  volume:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_INPUT: test-results/v076-levator-predictor-coupled
      QA_OUTPUT: test-results/v076-levator-bulk15
      QA_VOLUME_INDEX: '40'
      QA_VOLUME_BASE_BULK: '1000'
      QA_VOLUME_BULKS: '3000,10000'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: levator-predictor-coupled
          path: test-results/v076-levator-predictor-coupled/
          run-id: 46134663885
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install -r scripts/calibration/requirements.txt
      - run: python scripts/experimental/compare-levator-volume.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levator-bulk15
          path: test-results/v076-levator-bulk15/
  contact:
    strategy:
      fail-fast: false
      matrix:
        bone: [C1, C2, C3, C4, scapula]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_INPUT: test-results/v076-levator-predictor-coupled
      QA_OUTPUT: test-results/v076-levator-contact15-${{ matrix.bone }}
      QA_BONE: ${{ matrix.bone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: levator-predictor-coupled
          path: test-results/v076-levator-predictor-coupled/
          run-id: 46134663885
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install -r scripts/calibration/requirements.txt
      - run: python scripts/experimental/audit-levator-bone-contact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levator-contact15-${{ matrix.bone }}
          path: test-results/v076-levator-contact15-${{ matrix.bone }}/
