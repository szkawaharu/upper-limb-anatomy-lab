name: v0.76 levator source-surface attachment revision
on:
  push:
    branches: [redesign/v076-shoulder]
    paths:
      - '.github/workflows/v076-levator-surface-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_LEVATOR_EXPERIMENT: '1'
      QA_SHOULDER_PREVIEW: '1'
      QA_NUMERIC_ONLY: '1'
      QA_OUTPUT: test-results/v076-levator-surface-candidate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node tests/v076-geodesic-attachment.mjs
      - uses: actions/download-artifact@v4
        with:
          name: shoulder-preview-field
          path: test-results/v076-blend-preview/
          run-id: 46082847918
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install -r scripts/calibration/requirements.txt
      - run: |
          export CHROME_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          QA_EXPORT_LEVATOR=1 node tests/browser-v073.mjs
          python scripts/calibration/build-levator-surface-candidate.py
          QA_LEVATOR_MASK_FILE="$QA_OUTPUT/masks.json" node tests/browser-v073.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levator-surface-candidate
          path: test-results/v076-levator-surface-candidate/
