name: v0.76 levator source attachment surface audit
on:
  push:
    branches: [redesign/v076-shoulder]
    paths:
      - '.github/workflows/v076-levator-attachments.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-attachments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/calibration/requirements.txt
      - run: python scripts/calibration/audit-levator-attachment-surfaces.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levator-source-attachments
          path: test-results/v076-levator-attachments/
