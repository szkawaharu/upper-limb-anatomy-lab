name: v0.76 exact source shoulder recording candidates
on:
  push:
    branches: [redesign/v076-shoulder]
    paths:
      - 'scripts/calibration/recording-shoulder-candidates.mjs'
      - 'scripts/calibration/verify-recording-shoulder-candidates.py'
      - 'scripts/calibration/local-shoulder-step.py'
      - '.github/workflows/v076-recording-shoulder.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-shoulder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_LOCAL_SHOULDER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/calibration/requirements.txt
      - run: node scripts/calibration/recording-shoulder-candidates.mjs
      - run: python scripts/calibration/verify-recording-shoulder-candidates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recording-shoulder-candidates
          path: test-results/v076-recording-shoulder/
