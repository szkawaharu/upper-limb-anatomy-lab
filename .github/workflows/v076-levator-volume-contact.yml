name: v0.76 levator local volume and actual bone contact
on:
  push:
    branches: [redesign/v076-shoulder]
    paths:
      - '.github/workflows/v076-levator-volume-contact.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  volume:
    strategy:
      fail-fast: false
      matrix:
        mesh: [original, refined]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_INPUT: test-results/v076-levator-tangent
      QA_OUTPUT: test-results/v076-levator-bulk-${{ matrix.mesh }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: levator-tangent-${{ matrix.mesh }}
          path: test-results/v076-levator-tangent/
          run-id: 46122390087
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install -r scripts/calibration/requirements.txt
      - run: python scripts/experimental/compare-levator-volume.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levator-bulk-${{ matrix.mesh }}
          path: test-results/v076-levator-bulk-${{ matrix.mesh }}/
  contact:
    strategy:
      fail-fast: false
      matrix:
        bone: [C1, C2, C3, C4, scapula]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_INPUT: test-results/v076-levator-tangent
      QA_OUTPUT: test-results/v076-levator-contact-${{ matrix.bone }}
      QA_BONE: ${{ matrix.bone }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: levator-tangent-refined
          path: test-results/v076-levator-tangent/
          run-id: 46122390087
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install -r scripts/calibration/requirements.txt
      - run: python scripts/experimental/audit-levator-bone-contact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levator-contact-${{ matrix.bone }}
          path: test-results/v076-levator-contact-${{ matrix.bone }}/
